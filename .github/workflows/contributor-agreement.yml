name: Contributor agreement

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require ticked MIT agreement checkbox
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '^\s*- \[x\] I agree that my contribution is licensed under the MIT License'; then
            echo "Agreement confirmed."
          else
            echo "::error::Tick the contributor agreement checkbox in the PR description (see CONTRIBUTING.md)."
            exit 1
          fi
