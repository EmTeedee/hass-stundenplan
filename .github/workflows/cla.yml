name: CLA

# One-time contributor agreement: an author signs once by commenting on their first
# pull request; the signature is stored in the `cla-signatures` branch and covers all
# later pull requests.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLAAssistant
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/EmTeedee/hass-stundenplan/blob/main/CONTRIBUTING.md#contributor-agreement-mit
          branch: cla-signatures
          # maintainer and bots (e.g. Dependabot) do not need to sign
          allowlist: EmTeedee,dependabot[bot],github-actions[bot]
