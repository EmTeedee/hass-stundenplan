name: Release

# Runs when a version tag is pushed: v0.0.3 = release, v0.0.3-rc1 = pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version in manifest.json from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import json, sys
          path = "custom_components/stundenplan/manifest.json"
          data = json.load(open(path, encoding="utf-8"))
          data["version"] = sys.argv[1]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Build zip for HACS
        run: |
          cd custom_components/stundenplan
          zip -r ../../stundenplan.zip . -x "__pycache__/*" "*.pyc"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.0.3-rc1, v0.1.0-beta.1) are pre-releases: HACS only
          # offers them when "Show beta versions" is enabled, and they never become "latest".
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease --latest=false" ;;
          esac
          gh release create "$GITHUB_REF_NAME" stundenplan.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
